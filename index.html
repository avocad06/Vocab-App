<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vocab Card</title>
  <link rel="stylesheet" href="css/vocab.css" />
</head>

<body>
  <!-- 학년·Day 선택 화면 -->
  <div id="vocab-start-wrap">
    <p class="select-title">Vocab Card</p>
    <p class="select-sub">학년과 Day를 선택하면 바로 시작돼요</p>
    <div id="grade-tabs" class="grade-tabs"></div>
    <div id="day-grid" class="day-grid"></div>
  </div>

  <!-- 자동재생 토글 버튼 -->
  <div id="vocab-autoplay-wrap">
    <button id="btn-autoplay" class="autoplay-btn is-on" aria-label="자동재생">
      <span class="autoplay-label">Auto</span>
      <span class="autoplay-track">
        <span class="autoplay-thumb"></span>
      </span>
    </button>
    <button id="btn-help" class="help-btn" aria-label="도움말">?</button>
  </div>

  <!-- 현재 Day 인디케이터 (학습 중 상단 중앙) -->
  <div id="day-indicator-wrap">
    <button id="day-indicator" title="Day 변경">G1 · Day 1 ▾</button>
  </div>

  <!-- 도움말 모달 (z-index 최우선) -->
  <div id="help-modal" class="help-modal" hidden>
    <div class="help-modal__box">
      <p class="help-modal__title">Auto 기능 안내</p>
      <p class="help-modal__desc">
        Auto는 <strong>단어 카드 자동 넘김</strong> 기능이에요.<br><br>
        단어 하나의 학습 플레이(발음·뜻·예문)가 끝나면<br>
        자동으로 다음 단어 카드로 넘어가요.<br><br>
        <strong>Off</strong>로 설정하면 이전·다음 버튼으로<br>
        직접 카드를 넘길 수 있어요.
      </p>
      <button id="btn-help-close" class="help-modal__close">확인</button>
    </div>
  </div>

  <!-- Day 변경 모달 (학습 중) -->
  <div id="day-modal" class="vc-modal" hidden>
    <div class="vc-modal__box vc-modal__box--picker">
      <p class="vc-modal__title">어떤 Day를 학습할까요?</p>
      <div id="modal-grade-tabs" class="grade-tabs"></div>
      <div id="modal-day-grid" class="day-grid"></div>
      <div class="vc-modal__actions">
        <button id="btn-day-modal-close" class="vc-modal__close">닫기</button>
      </div>
    </div>
  </div>

  <!-- 단어 목록 모달 -->
  <div id="wordlist-modal" class="vc-modal" hidden>
    <div class="vc-modal__box vc-modal__box--list">
      <p id="wordlist-title" class="vc-modal__title"></p>
      <div id="wordlist-body" class="wordlist"></div>
      <div class="vc-modal__actions">
        <button id="btn-wordlist-start" class="vc-modal__primary">▶ 이 Day 시작</button>
        <button id="btn-wordlist-close" class="vc-modal__close">닫기</button>
      </div>
    </div>
  </div>

  <!-- 카드 + 이전/다음 버튼 레이아웃 -->
  <div id="vocab-layout">
    <button id="btn-prev" class="nav-btn" aria-label="이전">◀ 이전</button>
    <div id="vocab-root"></div>
    <button id="btn-next" class="nav-btn" aria-label="다음">다음 ▶</button>
  </div>

  <!-- 완료 버튼들 (마지막 페이지에만 표시) -->
  <div id="vocab-restart-wrap">
    <button id="btn-restart">↩ 처음부터</button>
    <button id="btn-day-select">📚 다른 Day</button>
  </div>

  <script src="data/words.js"></script>
  <script src="js/media-config.js"></script>
  <script src="js/media-loader.js"></script>
  <script src="js/audio-player.js"></script>
  <script src="js/vocab-card.js"></script>
  <script src="js/vocab-player.js"></script>
  <script src="js/day-select.js"></script>
  <script src="js/main.js"></script>
</body>

</html>
